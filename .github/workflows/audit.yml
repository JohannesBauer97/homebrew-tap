name: Audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit cask
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out tap
        uses: actions/checkout@v7

      - name: Audit fastproxy cask
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          brew tap JohannesBauer97/tap "$PWD"
          brew trust --cask JohannesBauer97/tap/fastproxy
          brew audit --cask --strict --online JohannesBauer97/tap/fastproxy
